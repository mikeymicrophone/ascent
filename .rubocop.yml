# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# The submodules are separate repositories with their own style.
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - "lib/micharisma_seeders/**/*"
    - "db/seeds/ascent_seed_data/**/*"
