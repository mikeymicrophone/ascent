<!doctype html>
<html lang="en">
  <head>
    <title>Something slipped · Ascent</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap">
    <style>
      :root {
        --brand-basalt: #15201B;
        --brand-slate: #3A4740;
        --brand-moss: #57645C;
        --brand-lichen: #F2F4EE;
        --brand-snow: #FFFFFF;
        --brand-mist: #D6DBD2;
        --brand-contour: #E4E8E0;
        --brand-summit: #C5EE3F;
        --brand-summit-deep: #4A6600;
        --brand-rope: #E05A12;
        --brand-rope-deep: #A8400B;
      }

      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(circle at top left, rgba(197, 238, 63, 0.18), transparent 42%),
          radial-gradient(circle at bottom right, rgba(224, 90, 18, 0.22), transparent 40%),
          linear-gradient(180deg, var(--brand-contour), var(--brand-lichen));
        color: var(--brand-basalt);
        font-family: "Bricolage Grotesque", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 42rem);
        padding: 2.5rem 2rem;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 2rem;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(242, 244, 238, 0.96));
        box-shadow: 0 20px 45px rgba(21, 32, 27, 0.12);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 1.75rem;
        color: inherit;
        text-decoration: none;
      }

      .brand-mark { width: 2.25rem; height: 2.25rem; }
      .brand-mark-far { fill: var(--brand-moss); }
      .brand-mark-near { fill: var(--brand-basalt); }
      .brand-mark-summit { fill: var(--brand-summit); }
      .brand-mark-rope { fill: none; stroke: var(--brand-rope); stroke-width: 2; }

      .brand-wordmark {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .kicker {
        color: var(--brand-summit-deep);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .code {
        margin: 0.85rem 0 0.4rem;
        color: var(--brand-rope-deep);
        font-family: "Martian Mono", monospace;
        font-size: clamp(3.5rem, 12vw, 5.5rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      h1 {
        margin-bottom: 0.85rem;
        font-size: clamp(1.8rem, 5vw, 2.75rem);
        font-weight: 700;
        line-height: 1.15;
      }

      .lead {
        max-width: 36rem;
        color: var(--brand-slate);
        font-size: 1.1rem;
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.65rem 1.15rem;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
      }

      .btn-primary {
        background: var(--brand-basalt);
        color: var(--brand-snow);
      }

      .btn-secondary {
        background: var(--brand-snow);
        border: 1px solid var(--brand-mist);
        color: var(--brand-basalt);
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Ascent home">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <path class="brand-mark-far" d="M1 34 L11 19 L21 34 Z"></path>
          <path class="brand-mark-near" d="M7 34 L22 6 L37 34 Z"></path>
          <path class="brand-mark-summit" d="M16.64 16 L22 6 L27.36 16 Z"></path>
          <path class="brand-mark-rope" d="M2 16 H38"></path>
        </svg>
        <span class="brand-wordmark">Ascent</span>
      </a>
      <p class="kicker">Something slipped</p>
      <p class="code" aria-hidden="true">500</p>
      <h1>Ascent hit an unexpected fault.</h1>
      <p class="lead">The request could not be finished. The team can inspect the logs. You can return home and try again in a moment.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Return to Overview</a>
        <a class="btn btn-secondary" href="/elections">Browse Elections</a>
      </div>
    </main>
  </body>
</html>
